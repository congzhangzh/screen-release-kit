name: Build, test and publish screen

# Builds the screen commit that sources.lock pins (or, on demand, another mirror branch) as a
# Debian package and a binary tarball in Debian testing, and tests it against an unfixed
# control. Every push to main that passes publishes the rolling release <YYYYMMDD>.<N>, as
# rdp-release-kit does: the .deb, the tarball and SHA256SUMS, as GitHub's latest release,
# published once and never replaced. A build whose inputs (the pin, the packaging, build.sh)
# are already released publishes nothing. A pull request, and a run with "ref", only build
# and test. What a push needs comes from ci/changes.sh, as rdp-release-kit decides it: no
# build when nothing a build reads changed (docs, the comments of sources.lock), build and
# test only when the scripts changed, and the release only when the pin, the packaging or
# ci/build.sh did. A run started by hand always builds.
on:
  push:
    branches: [main]
    # a change no build reads makes no new release
    paths-ignore: ['**.md', LICENSE]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Test this mirror branch or commit instead of the pin (e.g. integration-screen, before picking it); never published
        default: ''

permissions:
  contents: write

concurrency:
  group: kit-${{ github.ref }}
  # one run at a time, so each counts <N> from the releases before it; a newer push replaces
  # a run still waiting (the newest pin is what ships), never one already running

jobs:
  # none, test or release (ci/changes.sh)
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case $EVENT in
            push) scope=$(ci/changes.sh "$BEFORE" "$GITHUB_SHA") ;;
            pull_request) scope=$(ci/changes.sh "$BASE" "$GITHUB_SHA") ;;
            *) scope=release ;;
          esac
          echo "::notice::scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-latest
    container: debian:testing
    timeout-minutes: 30
    defaults:
      run:
        # A container job's default shell is sh (dash); the steps use bash.
        shell: bash
    steps:
      - name: Get the kit and the screen source
        env:
          REF: ${{ inputs.ref }}
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates > /dev/null
          git init -q kit
          git -C kit fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git -C kit checkout -q FETCH_HEAD
          kit/ci/resolve.sh kit screen "$REF" "$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_ENV"

      - name: Build and test
        run: kit/ci/run.sh screen "$SHA" "$CONTROL" "$VERSION" out

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-${{ env.VERSION }}
          path: |
            out/*.deb
            out/*.tar.gz
            out/SHA256SUMS
            out/test.log
          if-no-files-found: ignore

      - name: Publish the rolling release
        if: env.PINNED == 'true' && needs.changes.outputs.scope == 'release' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          day=$(date -u +%Y%m%d)
          n=$(( $(git -C kit ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$day.*" | wc -l) + 1 ))
          tag=$day.$n
          # what the package is made of; the same key again publishes nothing
          key="screen $VERSION ${SHA:0:12}, packaging $(git -C kit rev-parse --short=12 HEAD:packaging), build.sh $(git -C kit rev-parse --short=12 HEAD:ci/build.sh)"
          mirror=${SRC#https://github.com/}
          mirror=${mirror%.git}
          deb=$(cd out && ls screen_*_amd64.deb)
          tgz=$(cd out && ls screen-*.tar.gz)
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            echo "screen \`$VERSION\`, built by screen-release-kit \`${GITHUB_SHA:0:12}\` from [\`$REF\`](https://github.com/$mirror/tree/$REF) @ \`${SHA:0:12}\` and tested in Debian testing."
            echo
            if [ "$CONTROL" != - ]; then
              echo "**Base:** upstream $(git -C screen log -1 --format='`%h` %s' "$CONTROL")"
              echo
              echo "**Our commits on top:**"
              git -C screen log --reverse --format='- `%h` %s' "$CONTROL..$SHA"
              echo
            fi
            echo "**Packaging:** Debian's screen 5.0.2-1, without the patches upstream already has (91, 95, 98, 99, 100)."
            echo
            echo "**Tests** (\`ci/test.sh\`):"
            grep -E 'crashed \(|control crashed' out/test.log | sed -E 's/ \(work dir.*//; s/^/- /'
            echo
            echo "**Install** (Debian testing/unstable):"
            echo '```'
            echo "sudo apt install ./$deb"
            echo '```'
            echo "or, beside Debian's package, into \`~/.local\` (it then comes first in \`PATH\` and hides \`/usr/bin/screen\`):"
            echo '```'
            echo "mkdir -p ~/.local/lib/screen && tar -xzf $tgz -C ~/.local/lib/screen"
            echo "ln -sfn ~/.local/lib/screen/${tgz%-linux-*}/bin/screen ~/.local/bin/screen"
            echo '```'
            echo
            echo "Published once, never replaced. <!-- kit-key: $key --> <!-- version: $VERSION -->"
          } > out/notes.md
          cat out/notes.md
          KEY=$key CHECK_REPOS=$mirror python3 -I kit/ci/publish-release.py "$tag" "$GITHUB_SHA" \
            "screen $VERSION, $tag" out/notes.md out/*.deb out/*.tar.gz out/SHA256SUMS
